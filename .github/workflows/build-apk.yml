name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Upload key (only when the secrets exist)
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "UPLOAD_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "UPLOAD_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "UPLOAD_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
            sz=$(stat -c %s "$RUNNER_TEMP/upload.jks")
            fp=$(keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>&1 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::notice title=Key check::decoded file size $sz bytes (expected 2670); b64 text length ${#KS_B64} (expected 3560); keytool: $fp"
            cp "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/kp.jks"
            if keytool -keypasswd -keystore "$RUNNER_TEMP/kp.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" -keypass "$KS_KEYPASS" -new "tmpcheck123456" >/dev/null 2>&1; then
              echo "::notice title=Key password check::key password OK (length ${#KS_KEYPASS}, expected 20)"
            else
              echo "::error title=Key password check::key password WRONG (length ${#KS_KEYPASS}, expected 20); store password length ${#KS_PASS} (expected 20); alias length ${#KS_ALIAS} (expected 17)"
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
              echo "::error title=Key check failed::The keystore secret or its password is wrong. Decoded size $sz bytes (expected 2670), b64 length ${#KS_B64} (expected 3560)."
              exit 1
            fi
          else
            echo "No upload key secrets: signing with the debug key"
          fi
      - name: Build release APK and AAB
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log || {
            msg=$(grep -E '^e: |^w: .*(Unresolved|error)|What went wrong|FAILURE|Caused by' -A1 build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: HomeDragon-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeDragon-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
